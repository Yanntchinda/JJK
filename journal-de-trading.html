<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journal de Trading</title>
<style>
:root{
  color-scheme:dark;
  --bg:#060b17; --card:#0e172b; --card2:#111d36; --line:#1a2a4d; --line2:#27407a;
  --text:#e9efff; --mute:#8fa0c4; --dim:#5b6c91;
  --pos:#3aa0ff; --pos-bg:rgba(58,160,255,.13); --neg:#ff5063; --neg-bg:rgba(255,80,99,.13);
  --warn:#ffb547; --r:14px;
  --font:Inter,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 70% -10%,#0f1d3d 0%,transparent 60%),var(--bg);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .dim{color:var(--dim)} .mute{color:var(--mute)}
svg{display:block}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 20px;background:rgba(6,11,23,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.2px}
.brand svg{width:26px;height:26px}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
nav button{background:none;border:0;padding:7px 14px;border-radius:8px;color:var(--mute);cursor:pointer;font-weight:600}
nav button:hover{color:var(--text)}
nav button.on{background:var(--line);color:#fff}
.ctrls{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrls label{color:var(--mute);font-size:12px}
select,input[type=text],input[type=number],input[type=date],input[type=time],textarea{background:#0a1326;border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none;width:100%}
.ctrls select,.ctrls input{width:auto}
select:focus,input:focus,textarea:focus{border-color:var(--pos);box-shadow:0 0 0 3px rgba(58,160,255,.15)}
textarea{resize:vertical;min-height:90px}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--card2);border:1px solid var(--line2);color:var(--text);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--pos)}
.btn.primary{background:var(--pos);border-color:var(--pos);color:#04101f}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{border-color:#5b2430;color:var(--neg)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.ghost{background:none;border-color:transparent;padding:6px}
.btn.ghost:hover{background:var(--line)}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

main{padding:20px;max-width:1700px;margin:0 auto}
.card{background:linear-gradient(180deg,#101b33,#0c1529);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;min-width:0}
.card h3{margin:0 0 4px;font-size:15px}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.lbl{color:var(--mute);font-weight:600;font-size:13px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

/* dashboard grid */
.dash{display:grid;gap:16px;grid-template-columns:1fr 1fr}
.dash .bal,.dash .cal{grid-column:1/-1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(min-width:1101px){
  .dash{grid-template-columns:minmax(330px,.8fr) minmax(300px,1fr) minmax(360px,1.35fr);
    grid-template-areas:"count radar bal" "wr radar bal" "streak radar bal" "perf cal cal"}
  .dash .a-count{grid-area:count}.dash .a-wr{grid-area:wr}.dash .a-streak{grid-area:streak}.dash .a-radar{grid-area:radar}.dash .bal{grid-area:bal}.dash .a-perf{grid-area:perf}.dash .cal{grid-area:cal}
}
@media(max-width:700px){
  main{padding:12px}.dash,.row2{grid-template-columns:1fr}.top{padding:10px 12px}.ctrls{margin-left:0;width:100%}
}
.a-wr{background:none;border:0;padding:0;display:grid;gap:16px}
.a-wr .card{padding:16px}
.spark{height:70px;margin-top:6px}
.gauge{width:100%;max-width:190px;margin-top:4px}
.ratio-bar{height:16px;border-radius:9px;background:var(--neg);overflow:hidden;margin-top:18px}
.ratio-bar i{display:block;height:100%;background:var(--pos);border-radius:9px 0 0 9px}
.streaks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;text-align:center}
.sk{display:flex;flex-direction:column;align-items:center;gap:6px}
.sk .line{display:flex;align-items:center;gap:10px}
.sk .n{font-size:32px;font-weight:700}
.sk .ic{width:30px;height:30px}
.pills{display:flex;flex-direction:column;gap:4px}
.pills b{display:block;min-width:34px;padding:2px 8px;border-radius:7px;font-size:12px;text-align:center}
.pills .p{background:#143a68;color:#8fc8ff}.pills .l{background:#4a1f2a;color:#ff9aa6}
.chart{position:relative;height:280px;width:100%}
.chart svg{position:absolute;inset:0}
.bal{display:flex;flex-direction:column}
.bal .chart{flex:1;min-height:300px}
.radar-wrap{position:relative}
.radar-wrap .core{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:44px;font-weight:700;pointer-events:none}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:8px}
.scores div{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);padding:4px 0}
.scores b{color:var(--text)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #15233f;font-size:13px}
.kv:last-child{border:0}
.kv span:first-child{color:var(--mute)}
.sec>span:first-child{display:flex;align-items:center;gap:8px}.sec{display:flex;align-items:center;gap:8px;font-weight:700;margin:16px 0 6px}
.gain{border-left:3px solid var(--pos);padding-left:12px;display:flex;justify-content:space-between;gap:10px}
.gain .t{font-size:17px;font-weight:700}
.returns{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin-top:10px;gap:4px}
.returns div{border-right:1px solid var(--line);padding:2px 0}.returns div:last-child{border:0}
.returns small{display:block;color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 12px;cursor:pointer;color:var(--mute);font-weight:600}
.seg button.on{background:var(--line);color:#fff}

/* calendar */
.cal-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:600}
.cal-nav span{min-width:160px;text-align:center}
.chips{display:flex;gap:18px;background:#102244;border-radius:10px;padding:8px 16px;color:var(--pos);font-weight:600;text-align:center;font-size:13px}
.chips small{display:block;color:var(--mute);font-weight:500;font-size:11px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr) 1.15fr;gap:5px}
.cal-h{text-align:center;font-weight:700;padding:6px 0;color:var(--text)}
.cd{min-height:78px;border-radius:8px;padding:6px 8px;background:#0a1224;border-top:2px solid transparent;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;cursor:pointer;min-width:0}
.cd .dn{position:absolute;top:4px;left:7px;font-size:11px;color:var(--mute)}
.cd{overflow:hidden}.cd .v{font-weight:600;font-size:clamp(11px,1vw,14px);max-width:100%}.cd .s{font-size:11px;opacity:.8}
.cd.out{opacity:.3;cursor:default}
.cd.empty{color:var(--dim);font-size:15px}.cd.empty .mid{font-size:15px}
.cd.pos{background:linear-gradient(#10264a,#0e1d3a);border-top-color:var(--pos);color:var(--pos)}
.cd.neg{background:linear-gradient(#2a1521,#1d1220);border-top-color:var(--neg);color:var(--neg)}
.cd.tot{cursor:default;border:1px solid transparent}
.cd.tot.pos{border-color:var(--pos)}.cd.tot.neg{border-color:var(--neg)}
.cd.today{outline:1px dashed var(--warn);outline-offset:-3px}
.cd:not(.out):not(.tot):hover{filter:brightness(1.25)}
.cd .dot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
@media(max-width:700px){.cd{min-height:56px;padding:4px}.cd .v{font-size:9px;letter-spacing:-.3px}.cd .dn{font-size:9px;left:4px}.cd .s{display:none}.cal-grid{gap:3px;grid-template-columns:repeat(7,1fr) 1.5fr}.chips{gap:10px;padding:6px 10px}}

/* tables */
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.tools input[type=text]{max-width:220px}.tools select{width:auto}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #14233f;white-space:nowrap}
th{position:sticky;top:0;background:#0c1630;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;user-select:none}
th.r,td.r{text-align:right}
tbody tr{cursor:pointer}tbody tr:hover{background:#101c38}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.tag.long{background:var(--pos-bg);color:var(--pos)}.tag.short{background:var(--neg-bg);color:var(--neg)}
.empty-state{text-align:center;padding:46px 20px;color:var(--mute)}
.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:#0f2146;border:1px solid var(--line2);border-radius:12px;padding:14px 18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
.nodata{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(2,6,16,.72);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.overlay[hidden]{display:none}
.modal{background:#0d1730;border:1px solid var(--line2);border-radius:16px;width:100%;max-width:720px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.sm{max-width:420px}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.m-head h3{margin:0;font-size:17px}
.m-body{padding:18px 20px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.fg .full{grid-column:1/-1}
.fg label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px;font-weight:600}
.side{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.side label{margin:0;text-align:center;padding:8px;cursor:pointer;color:var(--mute);font-size:13px}
.side input{display:none}
.side input:checked+span{display:block}
.side label:has(input:checked).l{background:var(--pos-bg);color:var(--pos)}
.side label:has(input:checked).s{background:var(--neg-bg);color:var(--neg)}
.hint{font-size:11px;color:var(--dim);margin-top:4px}
.shot{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-top:8px;cursor:zoom-in}
.detail{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 16px}
.detail small{display:block;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.note{white-space:pre-wrap;background:#0a1326;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px}
#toasts{position:fixed;bottom:18px;right:18px;display:grid;gap:8px;z-index:90}
.toast{background:#13264d;border:1px solid var(--line2);padding:10px 16px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:340px}
.toast.err{border-color:var(--neg);background:#2a1521}
#tip{position:fixed;z-index:80;pointer-events:none;background:#0a1326;border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font-size:12px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.set-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.acc-row{display:grid;grid-template-columns:1fr 120px auto;gap:8px;margin-bottom:8px;align-items:center}
.acts{display:flex;flex-wrap:wrap;gap:8px}
h2.pg{margin:0 0 14px;font-size:20px}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#0f2146"/><path d="M9 8v16M16 6v18M23 10v14" stroke="#27407a" stroke-width="2"/><rect x="7" y="12" width="4" height="8" fill="#3aa0ff"/><rect x="14" y="9" width="4" height="9" fill="#ff5063"/><rect x="21" y="14" width="4" height="7" fill="#3aa0ff"/></svg>
    Journal de Trading
  </div>
  <nav id="nav"></nav>
  <div class="ctrls" id="ctrls"></div>
</header>
<main id="view"></main>

<div class="overlay" id="modal" hidden></div>
<div class="overlay" id="confirm" hidden style="z-index:70"></div>
<div id="toasts"></div>
<div id="tip"></div>
<input type="file" id="fileIn" hidden>

<script>
'use strict';
/* ======================= Utilitaires ======================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad2=n=>String(n).padStart(2,'0');
const dstr=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const pdate=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayStr=()=>dstr(new Date());
const addDays=(s,n)=>{const d=pdate(s);d.setDate(d.getDate()+n);return dstr(d)};
const dowMon=s=>(pdate(s).getDay()+6)%7;
const daysBetween=(a,b)=>Math.round((pdate(b)-pdate(a))/864e5);
const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DOW=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const DOWL=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const EMOS=['Calme','Confiant','Patient','Impatient','FOMO','Peur','Revanche','Euphorique','Fatigué'];
const PLANS={5:'Parfaite',4:'Bonne',3:'Moyenne',2:'Faible',1:'Aucune'};
const SYMS=['XAUUSD','EURUSD','GBPUSD','USDJPY','NAS100','US30','SPX500','GER40','BTCUSD','ETHUSD'];
const CURS={USD:'$',EUR:'€',GBP:'£',XAF:'FCFA',CAD:'CA$',CHF:'CHF'};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ICONS={plus:'M5 12h14M12 5v14',x:'M18 6 6 18M6 6l12 12',l:'m15 18-6-6 6-6',r:'m9 18 6-6-6-6',
 trash:'M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2',
 edit:'M17 3a2.85 2.85 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z',
 dl:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3',
 ul:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12',
 cam:'M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
 flame:'M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z',
 shield:'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z', trend:'m22 7-8.5 8.5-5-5L2 17M16 7h6v6'};
const ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24"><path d="${ICONS[n]}"/></svg>`;

/* ======================= État & stockage ======================= */
const KEY='trading-journal-v1';
const UI={view:'dash',sort:'date',dir:-1,q:'',sym:'',res:'',side:'',group:'setup',retMode:'pct',calMode:'pct'};
function defaults(){
  const n=new Date();
  return{accounts:[{id:'main',name:'Compte principal',initial:10000}],trades:[],notes:{},
    settings:{currency:'USD',account:'all',range:'all',from:'',to:'',calMonth:`${n.getFullYear()}-${pad2(n.getMonth()+1)}`}};
}
let S=(()=>{try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);const d=defaults();
  return{accounts:o.accounts?.length?o.accounts:d.accounts,trades:o.trades||[],notes:o.notes||{},settings:{...d.settings,...(o.settings||{})}}}}catch(e){}return defaults()})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Impossible de sauvegarder (stockage plein ou bloqué). Exportez une sauvegarde JSON.','err')}}
function toast(msg,type=''){const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),type?6000:2800)}

/* ======================= Formatage ======================= */
const nf=(d)=>new Intl.NumberFormat('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const num=(v,d=2)=>nf(d).format(v);
function money(v,sign=false){
  const c=S.settings.currency,s=CURS[c]||c,d=(c==='XAF')?0:2;
  const a=nf(d).format(Math.abs(v));const sg=v<0?'-':(sign&&v>0?'+':'');
  return (c==='EUR'||c==='XAF'||c==='CHF')?`${sg}${a} ${s}`:`${sg}${s}${a}`;
}
const pct=(v,sign=true)=>`${v>0&&sign?'+':''}${num(v)}%`;
const cls=v=>v>0?'pos':v<0?'neg':'';
const fdate=s=>s?s.split('-').reverse().join('/'):'';
const fdateLong=s=>{const d=pdate(s);return `${DOWL[dowMon(s)]} ${d.getDate()} ${MONTHS[d.getMonth()].toLowerCase()} ${d.getFullYear()}`};
const fmtR=r=>r==null?'—':`${r>0?'+':''}${num(r)}R`;

/* ======================= Calculs ======================= */
function guessMult(sym){
  const s=(sym||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(s.startsWith('XAU'))return 100; if(s.startsWith('XAG'))return 5000;
  if(/^[A-Z]{6}$/.test(s)&&!/(BTC|ETH|XRP|LTC|SOL)/.test(s))return s.endsWith('JPY')?1000:100000;
  return 1;
}
const calcPnl=t=>{
  if([t.entry,t.exit,t.size].some(v=>v==null||isNaN(v)))return null;
  return (t.exit-t.entry)*(t.side==='short'?-1:1)*t.size*(t.mult||1)-(t.fees||0);
};
const rMult=t=>{
  if(t.sl==null||t.entry==null||t.size==null||isNaN(t.sl))return null;
  const risk=Math.abs(t.entry-t.sl)*t.size*(t.mult||1);
  return risk>0?t.pnl/risk:null;
};
const cmpT=(a,b)=>(a.date+(a.time||'')+a.id).localeCompare(b.date+(b.time||'')+b.id);
const accSel=()=>S.settings.account;
const accTrades=()=>S.trades.filter(t=>accSel()==='all'||t.acc===accSel()).sort(cmpT);
const initialBal=()=>S.accounts.filter(a=>accSel()==='all'||a.id===accSel()).reduce((s,a)=>s+(+a.initial||0),0);
function getRange(){
  const s=S.settings,t=todayStr();
  switch(s.range){
    case'7':return{from:addDays(t,-6),to:t};case'30':return{from:addDays(t,-29),to:t};case'90':return{from:addDays(t,-89),to:t};
    case'month':return{from:t.slice(0,8)+'01',to:'9999-12-31'};
    case'year':return{from:t.slice(0,4)+'-01-01',to:'9999-12-31'};
    case'custom':return{from:s.from||'0000-00-00',to:s.to||'9999-12-31'};
    default:return{from:'0000-00-00',to:'9999-12-31'};
  }
}
function getCtx(){
  const all=accTrades(),r=getRange();
  const ts=all.filter(t=>t.date>=r.from&&t.date<=r.to);
  const init=initialBal();
  const start=init+all.filter(t=>t.date<r.from).reduce((s,t)=>s+t.pnl,0);
  return{all,ts,r,init,start,A:analyze(ts),eq:equity(ts,start)};
}
function streakOf(vals){
  let run=0,bw=0,bl=0;
  for(const p of vals){if(p>0)run=run>0?run+1:1;else if(p<0)run=run<0?run-1:-1;bw=Math.max(bw,run);bl=Math.max(bl,-run)}
  return{cur:run,bw,bl};
}
function analyze(ts){
  let wins=0,losses=0,be=0,gp=0,gl=0,net=0,fees=0,rs=[],best=null,worst=null;
  const days=new Map();
  for(const t of ts){
    const p=t.pnl;net+=p;fees+=t.fees||0;
    if(p>0){wins++;gp+=p}else if(p<0){losses++;gl-=p}else be++;
    const r=rMult(t);if(r!=null)rs.push(r);
    if(best==null||p>best.pnl)best=t;if(worst==null||p<worst.pnl)worst=t;
    days.set(t.date,(days.get(t.date)||0)+p);
  }
  const n=ts.length,dv=[...days.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(x=>x[1]);
  const avgWin=wins?gp/wins:0,avgLoss=losses?gl/losses:0;
  const plans=ts.map(t=>t.plan).filter(v=>v);
  return{n,wins,losses,be,gp,gl,net,fees,best,worst,
    winrate:(wins+losses)?wins/(wins+losses):0,avgWin,avgLoss,
    ratio:n==0?null:(avgLoss?avgWin/avgLoss:(avgWin?Infinity:0)),
    pf:n==0?null:(gl?gp/gl:(gp?Infinity:0)),
    exp:n?net/n:0,avgR:rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null,
    tStreak:streakOf(ts.map(t=>t.pnl)),dStreak:streakOf(dv),
    nDays:days.size,greenDays:dv.filter(v=>v>0).length,
    plan:plans.length?plans.reduce((a,b)=>a+b,0)/plans.length:null};
}
function equity(ts,start){
  let bal=start,peak=start,maxDD=0,maxDDp=0;
  const pts=[{date:ts[0]?.date||todayStr(),bal:start,pnl:0,dd:0,start:true}];
  for(const t of ts){
    bal+=t.pnl;if(bal>peak)peak=bal;
    const dd=peak-bal,dp=peak>0?dd/peak*100:0;
    if(dd>maxDD)maxDD=dd;if(dp>maxDDp)maxDDp=dp;
    pts.push({date:t.date,bal,pnl:t.pnl,dd:dp,sym:t.symbol});
  }
  return{pts,peak,maxDD,maxDDp,end:bal};
}
function groupBy(ts,fn){
  const m=new Map();
  ts.forEach(t=>{const k=fn(t)||'—';if(!m.has(k))m.set(k,[]);m.get(k).push(t)});
  return[...m].map(([k,a])=>({k,a:analyze(a)})).sort((x,y)=>y.a.net-x.a.net);
}
function scores(A,eq){
  if(!A.n)return null;
  const s={
    'Réussite':clamp(A.winrate/0.6)*100,
    'Rentabilité':A.pf===Infinity?100:clamp((A.pf||0)/2)*100,
    'Risque':clamp(1-eq.maxDDp/20)*100,
    'Discipline':A.plan==null?50:A.plan*20,
    'Régularité':A.nDays?A.greenDays/A.nDays*100:0};
  return s;
}

function niceTicks(min,max,n=5){
  if(min===max){min-=1;max+=1}
  const raw=(max-min)/(n-1),mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag;
  const step=(f<1.5?1:f<3?2:f<7?5:10)*mag;
  const a=Math.floor(min/step)*step,t=[];
  for(let v=a;v<max+step*.999;v+=step)t.push(+v.toFixed(10));
  return t;
}
const tip=$('#tip');
function showTip(h,x,y){tip.innerHTML=h;tip.style.display='block';const w=tip.offsetWidth,hh=tip.offsetHeight;
  tip.style.left=Math.min(innerWidth-w-8,Math.max(8,x+14))+'px';tip.style.top=Math.max(8,y-hh-10)+'px'}
const hideTip=()=>tip.style.display='none';

function lineChart(el,pts,o={}){
  const key=o.key||'bal',fmt=o.fmt||(v=>num(v)),color=o.color||'#3aa0ff',gid='g'+el.id;
  const W=el.clientWidth,H=el.clientHeight;
  if(pts.length<2){el.innerHTML='<div class="nodata">Pas assez de données</div>';return}
  const vals=pts.map(p=>p[key]);let mn=Math.min(...vals),mx=Math.max(...vals);
  if(o.zero){mn=Math.min(mn,0);mx=Math.max(mx,0)}
  const pr=(mx-mn||1)*.06;mn-=pr;mx+=pr;if(o.zero&&mx<0.0001)mx=0;
  const ticks=niceTicks(mn,mx,5),lo=ticks[0],hi=ticks[ticks.length-1];
  const lab=Math.max(...ticks.map(t=>fmt(t).length))*7+14;
  const P={l:lab,r:14,t:12,b:26},iw=W-P.l-P.r,ih=H-P.t-P.b;
  const X=i=>P.l+i/(pts.length-1)*iw,Y=v=>P.t+(1-(v-lo)/(hi-lo))*ih;
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p[key]).toFixed(1)}`).join('');
  const area=`${line}L${X(pts.length-1)},${P.t+ih}L${X(0)},${P.t+ih}Z`;
  let g='';
  ticks.forEach(t=>{const y=Y(t);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="#16264a" stroke-dasharray="2 4"/><text x="${P.l-8}" y="${y+4}" text-anchor="end" fill="#8fa0c4" font-size="11">${fmt(t)}</text>`});
  const xi=[0,Math.round((pts.length-1)/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  xi.forEach((i,k)=>{g+=`<text x="${X(i)}" y="${H-6}" text-anchor="${k==0?'start':k==xi.length-1?'end':'middle'}" fill="#8fa0c4" font-size="11">${fdate(pts[i].date).slice(0,5)}</text>`});
  el.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".38"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${g}
   <path d="${area}" fill="url(#${gid})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>
   <line class="vl" y1="${P.t}" y2="${P.t+ih}" stroke="#4a6399" display="none"/><circle class="mk" r="5" fill="${color}" stroke="#0a1326" stroke-width="2" display="none"/>
   <rect x="${P.l}" y="${P.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  const svg=el.firstChild,vl=$('.vl',svg),mk=$('.mk',svg);
  const mv=e=>{const b=svg.getBoundingClientRect(),cx=(e.touches?e.touches[0].clientX:e.clientX);
    const i=clamp(Math.round((cx-b.left-P.l)/iw*(pts.length-1)),0,pts.length-1),p=pts[i];
    vl.setAttribute('x1',X(i));vl.setAttribute('x2',X(i));vl.removeAttribute('display');
    mk.setAttribute('cx',X(i));mk.setAttribute('cy',Y(p[key]));mk.removeAttribute('display');
    showTip(o.tip?o.tip(p):`<b>${fmt(p[key])}</b><br><span class="mute">${fdate(p.date)}</span>`,cx,b.top+Y(p[key]))};
  svg.addEventListener('mousemove',mv);svg.addEventListener('touchmove',mv,{passive:true});
  svg.addEventListener('mouseleave',()=>{hideTip();vl.setAttribute('display','none');mk.setAttribute('display','none')});
}
function barChart(el,items,o={}){
  const fmt=o.fmt||(v=>num(v,Math.abs(v)>=100?0:2));
  const W=el.clientWidth,H=el.clientHeight;
  if(!items.length){el.innerHTML='<div class="nodata">Pas de données</div>';return}
  let mn=Math.min(0,...items.map(i=>i.v)),mx=Math.max(0,...items.map(i=>i.v));
  const ticks=niceTicks(mn,mx,4),lo=Math.min(ticks[0],mn),hi=Math.max(ticks[ticks.length-1],mx);
  const lab=Math.max(...ticks.map(t=>fmt(t).length))*7+14,P={l:lab,r:8,t:10,b:26},iw=W-P.l-P.r,ih=H-P.t-P.b;
  const Y=v=>P.t+(1-(v-lo)/(hi-lo))*ih,sw=iw/items.length,bw=Math.min(40,sw*.62);
  let g='';
  ticks.forEach(t=>{const y=Y(t);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="${t===0?'#33508f':'#16264a'}" ${t===0?'':'stroke-dasharray="2 4"'}/><text x="${P.l-8}" y="${y+4}" text-anchor="end" fill="#8fa0c4" font-size="11">${fmt(t)}</text>`});
  const skip=Math.ceil(items.length/Math.max(1,Math.floor(iw/38)));
  items.forEach((it,i)=>{const x=P.l+sw*i+(sw-bw)/2,y0=Y(0),y1=Y(it.v),c=it.v>=0?'#3aa0ff':'#ff5063';
    g+=`<rect x="${x}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(2,Math.abs(y1-y0))}" rx="3" fill="${c}" opacity=".9"/>`;
    if(i%skip===0)g+=`<text x="${P.l+sw*i+sw/2}" y="${H-7}" text-anchor="middle" fill="#8fa0c4" font-size="11">${esc(it.l)}</text>`});
  el.innerHTML=`<svg width="${W}" height="${H}">${g}<rect x="${P.l}" y="0" width="${iw}" height="${H}" fill="transparent"/></svg>`;
  const svg=el.firstChild;
  svg.addEventListener('mousemove',e=>{const b=svg.getBoundingClientRect(),i=Math.floor((e.clientX-b.left-P.l)/sw);
    if(i<0||i>=items.length){hideTip();return}const it=items[i];
    showTip(`<b>${esc(it.l)}</b><br><span class="${cls(it.v)}">${(o.tipFmt||fmt)(it.v)}</span>${it.s?`<br><span class="mute">${it.s}</span>`:''}`,e.clientX,e.clientY)});
  svg.addEventListener('mouseleave',hideTip);
}
function sparkline(el,vals){
  const W=el.clientWidth,H=el.clientHeight;
  if(!vals.length){el.innerHTML='';return}
  if(vals.length===1)vals=[vals[0],vals[0]];
  const mx=Math.max(...vals),mn=0,X=i=>6+i/(vals.length-1)*(W-12),Y=v=>H-6-(v-mn)/((mx-mn)||1)*(H-14);
  const l=vals.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  el.innerHTML=`<svg width="${W}" height="${H}"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3aa0ff" stop-opacity=".35"/><stop offset="1" stop-color="#3aa0ff" stop-opacity="0"/></linearGradient></defs>
  <path d="${l}L${X(vals.length-1)},${H}L${X(0)},${H}Z" fill="url(#sg)"/><path d="${l}" fill="none" stroke="#3aa0ff" stroke-width="2" stroke-linejoin="round"/></svg>`;
}
function gaugeSvg(rate,has){
  const cx=70,cy=70,R=56,a=Math.PI,pt=(t)=>[cx+R*Math.cos(Math.PI+t*Math.PI),cy+R*Math.sin(Math.PI+t*Math.PI)];
  const arc=(t0,t1,c)=>{if(t1-t0<=0.0001)return'';const[x0,y0]=pt(t0),[x1,y1]=pt(t1);return`<path d="M${x0},${y0}A${R},${R} 0 0 1 ${x1},${y1}" fill="none" stroke="${c}" stroke-width="16"/>`};
  return`<svg class="gauge" viewBox="0 0 140 80">${has?arc(0,rate,'#1d6fd1')+arc(rate,1,'#ff4d5e'):arc(0,1,'#1a2a4d')}</svg>`;
}
function radarSvg(sc){
  const cx=150,cy=125,R=95,keys=Object.keys(sc||{Réussite:0,Rentabilité:0,Risque:0,Discipline:0,Régularité:0});
  const ang=i=>-Math.PI/2+i*2*Math.PI/5,P=(i,f)=>[cx+R*f*Math.cos(ang(i)),cy+R*f*Math.sin(ang(i))];
  let g='';
  [.25,.5,.75,1].forEach(f=>g+=`<polygon points="${keys.map((_,i)=>P(i,f).join(',')).join(' ')}" fill="none" stroke="#1d2f5a"/>`);
  keys.forEach((k,i)=>{const[x,y]=P(i,1),[lx,ly]=P(i,1.2);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#1a2a4d"/><text x="${lx}" y="${ly+4}" text-anchor="${Math.abs(lx-cx)<8?'middle':lx>cx?'start':'end'}" fill="#cdd8f3" font-size="12" font-weight="600">${k}</text>`});
  if(sc){const pts=keys.map((k,i)=>P(i,Math.max(.03,sc[k]/100)));
    g+=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="rgba(58,160,255,.22)" stroke="#3aa0ff" stroke-width="2"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#3aa0ff"/>`).join('')}
  return`<svg viewBox="-40 0 380 250" width="100%">${g}</svg>`;
}

function viewCal(){
  const[Y,M]=S.settings.calMonth.split('-').map(Number),mk=`${Y}-${pad2(M)}`,first=mk+'-01',dim=new Date(Y,M,0).getDate();
  const all=accTrades(),init=initialBal(),day=new Map();
  all.forEach(t=>{const d=day.get(t.date)||{pnl:0,n:0,w:0};d.pnl+=t.pnl;d.n++;if(t.pnl>0)d.w++;day.set(t.date,d)});
  const balBefore=ds=>init+all.reduce((s,t)=>t.date<ds?s+t.pnl:s,0);
  const mt=all.filter(t=>t.date.startsWith(mk)),mA=analyze(mt),mBal=balBefore(first);

function filteredTrades(){

  if(q)ts=ts.filter(t=>[t.symbol,t.setup,t.emotion,t.tags,t.notes].join(' ').toLowerCase().includes(q));
  if(UI.sym)ts=ts.filter(t=>t.symbol===UI.sym);
  if(UI.side)ts=ts.filter(t=>t.side===UI.side);
  if(UI.res==='w')ts=ts.filter(t=>t.pnl>0);else if(UI.res==='l')ts=ts.filter(t=>t.pnl<0);else if(UI.res==='b')ts=ts.filter(t=>t.pnl===0);
  const k=UI.sort,d=UI.dir;
  const val={date:t=>t.date+(t.time||''),symbol:t=>t.symbol,side:t=>t.side,pnl:t=>t.pnl,r:t=>rMult(t)??-1e9,setup:t=>t.setup||'',emotion:t=>t.emotion||''}[k]||(t=>t.date);
  return ts.slice().sort((a,b)=>{const x=val(a),y=val(b);return(x>y?1:x<y?-1:0)*d});
}

  <div class="detail">${f('Date',fdate(t.date)+(t.time?' · '+t.time:''))}${f('Compte',esc(acc?.name||'—'))}${f('Entrée',t.entry??'—')}${f('Sortie',t.exit??'—')}${f('Taille',t.size??'—')}${f('Stop loss',t.sl??'—')}${f('Take profit',t.tp??'—')}${f('Frais',money(t.fees||0))}${f('Setup',esc(t.setup||'—'))}${f('Émotion',esc(t.emotion||'—'))}${f('Respect du plan',t.plan?t.plan+' — '+PLANS[t.plan]:'—')}${f('Tags',esc(t.tags||'—'))}</div>
  ${t.notes?`<div class="note">${esc(t.notes)}</div>`:''}${t.shot?`<img class="shot" src="${t.shot}" data-act="zoom" alt="capture">`:''}</div>
  <div class="m-foot"><button class="btn danger" data-act="del" data-id="${t.id}">${ic('trash')} Supprimer</button><button class="btn primary" data-act="edit" data-id="${t.id}">${ic('edit')} Modifier</button></div>`);
}
function dayModal(ds){
  const ts=accTrades().filter(t=>t.date===ds),A=analyze(ts);
  openModal(`<div class="m-head"><h3>${fdateLong(ds)}</h3><button class="btn ghost" data-act="close">${ic('x')}</button></div>

  ${ts.length?`<div class="tbl-wrap" style="margin-bottom:16px"><table style="min-width:0"><tbody>${ts.map(t=>`<tr data-act="view" data-id="${t.id}"><td>${t.time||'—'}</td><td><b>${esc(t.symbol)}</b></td><td><span class="tag ${t.side}">${t.side.toUpperCase()}</span></td><td>${esc(t.setup||'')}</td><td class="r num ${cls(t.pnl)}"><b>${money(t.pnl,true)}</b></td></tr>`).join('')}</tbody></table></div>`:'<p class="mute">Aucun trade ce jour-là.</p>'}
  <div class="fg"><div class="full"><label style="display:block;font-size:12px;color:var(--mute);font-weight:600;margin-bottom:4px">Notes du jour (plan, bilan, leçons)</label><textarea id="dayNote" placeholder="Biais du jour, niveaux clés, ce que j'ai bien/mal fait…">${esc(S.notes[ds]||'')}</textarea><div class="hint">Enregistré automatiquement.</div></div></div></div>
  <div class="m-foot"><button class="btn primary" data-act="add" data-date="${ds}">${ic('plus')} Ajouter un trade</button></div>`);
  $('#dayNote').addEventListener('input',e=>{const v=e.target.value;if(v.trim())S.notes[ds]=v;else delete S.notes[ds];save()});
}

/* ======================= Données : import / export ======================= */
function download(name,text,type='text/plain'){const b=new Blob([text],{type:type+';charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const CSVH=['date','heure','compte','symbole','sens','entree','sortie','taille','multiplicateur','sl','tp','frais','pnl','setup','emotion','discipline','tags','notes'];
function toCSV(ts){
  const q=v=>{v=v==null?'':String(v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return'﻿'+[CSVH.join(';')].concat(ts.map(t=>[t.date,t.time,S.accounts.find(a=>a.id===t.acc)?.name,t.symbol,t.side,t.entry,t.exit,t.size,t.mult,t.sl,t.tp,t.fees,t.pnl,t.setup,t.emotion,t.plan,t.tags,t.notes].map(q).join(';'))).join('\r\n');
}
function parseCSV(text){
  text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0],d=first.split(';').length>=first.split(',').length?';':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===d){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x!==''))rows.push(row);row=[]}
    else cur+=c}
  row.push(cur);if(row.some(x=>x!==''))rows.push(row);return rows;
}
const normH=h=>h.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const HMAP={date:'date',opentime:'date',heure:'time',time:'time',compte:'acc',account:'acc',symbole:'symbol',symbol:'symbol',instrument:'symbol',sens:'side',side:'side',type:'side',direction:'side',
  entree:'entry',entry:'entry',openprice:'entry',prixentree:'entry',price:'entry',sortie:'exit',exit:'exit',closeprice:'exit',prixsortie:'exit',taille:'size',size:'size',volume:'size',lots:'size',
  multiplicateur:'mult',mult:'mult',sl:'sl',stoploss:'sl',tp:'tp',takeprofit:'tp',frais:'fees',fees:'fees',commission:'fees',pnl:'pnl',profit:'pnl',resultat:'pnl',netpnl:'pnl',
  setup:'setup',strategie:'setup',emotion:'emotion',discipline:'plan',plan:'plan',tags:'tags',notes:'notes',commentaire:'notes'};
function normDate(s){s=(s||'').trim().split(/[ T]/)[0];let m;
  if(m=s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/))return`${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  if(m=s.match(/^(\d{1,2})[-./](\d{1,2})[-./](\d{4})$/))return`${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;return null}
const pnum=v=>{if(v==null)return null;v=String(v).trim().replace(/\s/g,'').replace(/ /g,'');if(!v)return null;if(/^-?\d+,\d+$/.test(v))v=v.replace(',','.');const n=parseFloat(v);return isNaN(n)?null:n};
function importCSV(text){
  const rows=parseCSV(text);if(rows.length<2){toast('Fichier CSV vide.','err');return}
  const cols=rows[0].map(h=>HMAP[normH(h)]||null);
  if(!cols.includes('date')||!cols.includes('symbol')||!cols.includes('pnl')){toast('Colonnes requises : date, symbole, pnl. Téléchargez le modèle CSV.','err');return}
  let ok=0,bad=0;
  for(const r of rows.slice(1)){
    const o={};cols.forEach((c,i)=>{if(c&&o[c]==null)o[c]=r[i]});
    const date=normDate(o.date),pnl=pnum(o.pnl),sym=(o.symbol||'').trim().toUpperCase();
    if(!date||pnl==null||!sym){bad++;continue}
    const sd=(o.side||'').toLowerCase(),side=/short|sell|vente|s$/.test(sd)?'short':'long';
    let acc=S.accounts[0].id;
    if(o.acc&&o.acc.trim()){let a=S.accounts.find(x=>x.name.toLowerCase()===o.acc.trim().toLowerCase());if(!a){a={id:uid(),name:o.acc.trim(),initial:0};S.accounts.push(a)}acc=a.id}
    else if(S.settings.account!=='all')acc=S.settings.account;
    const tm=(o.time||'').trim().match(/(\d{1,2}):(\d{2})/);
    S.trades.push({id:uid(),acc,date,time:tm?`${pad2(tm[1])}:${tm[2]}`:'',symbol:sym,side,entry:pnum(o.entry),exit:pnum(o.exit),size:pnum(o.size),mult:pnum(o.mult)||guessMult(sym),sl:pnum(o.sl),tp:pnum(o.tp),fees:Math.abs(pnum(o.fees)||0),pnl,
      setup:(o.setup||'').trim(),emotion:(o.emotion||'').trim(),plan:pnum(o.plan)>=1&&pnum(o.plan)<=5?pnum(o.plan):null,tags:(o.tags||'').trim(),notes:(o.notes||'').trim(),shot:null});ok++;
  }
  save();render();toast(`${ok} trade(s) importé(s)${bad?` · ${bad} ligne(s) ignorée(s)`:''}`,bad&&!ok?'err':'');
}
function pickFile(accept,cb){const fi=$('#fileIn');fi.accept=accept;fi.value='';fi.onchange=()=>{const f=fi.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>cb(rd.result);rd.readAsText(f)};fi.click()}

/* ======================= Démo ======================= */
function seedDemo(){
  let s=42;const rng=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const id='demo'+uid();S.accounts.push({id,name:'Compte démo',initial:10000});
  const mk=[['XAUUSD',100,2650,[4,11],2],['NAS100',1,20800,[45,120],1],['EURUSD',100000,1.085,[.0008,.002],5],['US30',1,42500,[90,200],1]];
  const setups=['Order Block','FVG','Liquidity Sweep','Breaker Block','London Open'];
  let bal=10000;const today=todayStr();
  for(let i=75;i>=0;i--){const ds=addDays(today,-i);if(dowMon(ds)>4)continue;
    const n=rng()<.15?0:1+Math.floor(rng()*3);
    for(let k=0;k<n;k++){
      const[sym,mult,base,dr,dec]=mk[Math.floor(rng()*mk.length)],dir=rng()<.52?1:-1,win=rng()<.55;
      const dist=dr[0]+rng()*(dr[1]-dr[0]),risk=bal*.01,size=Math.max(.01,+(risk/(dist*mult)).toFixed(2));
      const entry=+(base*(1+(rng()-.5)*.02)).toFixed(dec),R=win?1+rng()*2.3:(rng()<.2?.4+rng()*.5:1)*-1;
      const exit=+(entry+dir*R*dist).toFixed(dec),fees=+(size*7).toFixed(2);
      const t={id:uid(),acc:id,date:ds,time:`${pad2(rng()<.6?8+Math.floor(rng()*3):14+Math.floor(rng()*3))}:${pad2(Math.floor(rng()*60))}`,symbol:sym,side:dir>0?'long':'short',entry,exit,size,mult,
        sl:+(entry-dir*dist).toFixed(dec),tp:+(entry+dir*dist*2.5).toFixed(dec),fees,pnl:0,setup:setups[Math.floor(rng()*setups.length)],
        emotion:win?['Calme','Confiant','Patient'][Math.floor(rng()*3)]:['FOMO','Impatient','Revanche','Calme','Peur'][Math.floor(rng()*5)],
        plan:win?(rng()<.8?5:4):(rng()<.5?2:4),tags:'',notes:rng()<.12?(win?'Entrée propre après sweep de liquidité, patience récompensée.':'Entrée trop tôt, stop touché. Attendre la confirmation.'):'',shot:null};
      t.pnl=+calcPnl(t).toFixed(2);bal+=t.pnl;S.trades.push(t);
    }}
  S.settings.account=id;S.settings.range='all';S.settings.calMonth=today.slice(0,7);save();
}

/* ======================= Événements ======================= */
document.addEventListener('click',async e=>{
  const nav=e.target.closest('[data-view]');if(nav){UI.view=nav.dataset.view;render();window.scrollTo(0,0);return}
  const sort=e.target.closest('[data-sort]');if(sort){const k=sort.dataset.sort;if(UI.sort===k)UI.dir*=-1;else{UI.sort=k;UI.dir=k==='date'||k==='pnl'||k==='r'?-1:1}render();return}
  const rb=e.target.closest('[data-ret]');if(rb){UI.retMode=rb.dataset.ret;render();return}
  const cb=e.target.closest('[data-cal]');if(cb){UI.calMode=cb.dataset.cal;render();return}
  if(e.target.id==='modal'){closeModal();return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,id=a.dataset.id,S_=S.settings;
  const shiftMonth=n=>{let[y,m]=S_.calMonth.split('-').map(Number);m+=n;if(m<1){m=12;y--}if(m>12){m=1;y++}S_.calMonth=`${y}-${pad2(m)}`;save();render()};
  switch(act){
    case'close':closeModal();break;
    case'add':tradeForm(null,a.dataset.date?{date:a.dataset.date}:{});break;
    case'edit':e.stopPropagation();tradeForm(S.trades.find(t=>t.id===id));break;
    case'view':tradeDetail(id);break;
    case'zoom':{const w=window.open();if(w){w.document.write(`<body style="margin:0;background:#000"><img src="${a.src}" style="max-width:100%">`)}break}
    case'del':{e.stopPropagation();if(await askConfirm('Supprimer définitivement ce trade ?','Supprimer')){S.trades=S.trades.filter(t=>t.id!==id);save();closeModal();render();toast('Trade supprimé')}break}
    case'day':dayModal(a.dataset.date);break;
    case'cal-prev':shiftMonth(-1);break;case'cal-next':shiftMonth(1);break;
    case'cal-today':S_.calMonth=todayStr().slice(0,7);save();render();break;
    case'export-csv':download(`trades-${todayStr()}.csv`,toCSV(filteredTrades()),'text/csv');break;
    case'export-csv-all':download(`trades-${todayStr()}.csv`,toCSV(S.trades.slice().sort(cmpT)),'text/csv');break;
    case'csv-template':download('modele-journal.csv',toCSV([{date:todayStr(),time:'09:30',acc:S.accounts[0].id,symbol:'XAUUSD',side:'long',entry:2650.5,exit:2658.2,size:.1,mult:100,sl:2645,tp:2665,fees:0.7,pnl:76.3,setup:'Order Block',emotion:'Calme',plan:5,tags:'london',notes:'Exemple'}]),'text/csv');break;
    case'import-csv':pickFile('.csv,text/csv,text/plain',importCSV);break;
    case'export-json':download(`journal-sauvegarde-${todayStr()}.json`,JSON.stringify(S),'application/json');toast('Sauvegarde téléchargée');break;
    case'import-json':pickFile('.json,application/json',async txt=>{try{const o=JSON.parse(txt);if(!Array.isArray(o.trades)||!Array.isArray(o.accounts))throw 0;
      if(await askConfirm('Remplacer toutes les données actuelles par cette sauvegarde ?','Restaurer')){S={...defaults(),...o,settings:{...defaults().settings,...(o.settings||{})}};save();render();toast('Sauvegarde restaurée')}}catch(err){toast('Fichier JSON invalide.','err')}});break;
    case'demo':seedDemo();UI.view='dash';render();toast('Données de démo chargées (Compte démo)');break;
    case'clear':if(await askConfirm('Effacer <b>tous</b> les trades, comptes et notes ? Cette action est irréversible.','Tout effacer')){const cur=S.settings.currency;S=defaults();S.settings.currency=cur;save();render();toast('Données effacées')}break;
    case'add-acc':S.accounts.push({id:uid(),name:'Nouveau compte',initial:0});save();render();break;
    case'del-acc':{if(S.accounts.length<2){toast('Il faut conserver au moins un compte.','err');break}
      const n=S.trades.filter(t=>t.acc===id).length;
      if(await askConfirm(`Supprimer ce compte${n?` et ses ${n} trade(s)`:''} ?`,'Supprimer')){S.accounts=S.accounts.filter(x=>x.id!==id);S.trades=S.trades.filter(t=>t.acc!==id);if(S_.account===id)S_.account='all';save();render()}break}
  }
});
document.addEventListener('change',e=>{
  const t=e.target,s=S.settings;
  if(t.id==='selAcc'){s.account=t.value;save();render()}
  else if(t.id==='selRange'){s.range=t.value;save();render()}
  else if(t.id==='rFrom'){s.from=t.value;save();render()}
  else if(t.id==='rTo'){s.to=t.value;save();render()}
  else if(t.id==='selCur'){s.currency=t.value;save();render()}
  else if(t.id==='fSym'){UI.sym=t.value;render()}
  else if(t.id==='fSide'){UI.side=t.value;render()}
  else if(t.id==='fRes'){UI.res=t.value;render()}
  else if(t.id==='grp'){UI.group=t.value;render()}
  else if(t.dataset.acc){const a=S.accounts.find(x=>x.id===t.dataset.acc);if(a){a[t.dataset.f]=t.dataset.f==='initial'?(parseFloat(t.value)||0):(t.value.trim()||'Compte');save();renderTop()}}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){UI.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#confirm').hidden){$('#cNo')?.click()}else if(!$('#modal').hidden)closeModal()}});
render();
