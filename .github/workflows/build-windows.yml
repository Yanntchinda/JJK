name: Build Windows EXE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer l’installeur Windows
        shell: pwsh
        run: |
          npm run dist 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publier l’installeur comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: bookmap-trading-journal-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publier les diagnostics en cas d’échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Résumer l’erreur de compilation dans le résultat GitHub
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            $details = (Get-Content build.log -Tail 30) -join "`n"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Build output::$details"
          }
